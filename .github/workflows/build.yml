# Testy + build Windows przy każdym pushu. Gotowa gra: zakładka Actions → ostatnie uruchomienie → artefakt "Otchlan-Windows".
name: Build

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Godot .NET
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip -d $HOME
          sudo ln -s $HOME/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64 /usr/local/bin/godot

      - name: Szablony eksportu (Windows)
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          T=$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p $T
          unzip -q -j Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz 'templates/windows_*_x86_64*' 'templates/version.txt' -d $T

      - name: Kompilacja C#
        run: dotnet build -c Debug

      - name: Import zasobów
        run: godot --headless --path . --import || true

      - name: Testy
        run: godot --headless --path . -- --run-tests

      - name: Eksport Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows" build/windows/Otchlan.exe 2>&1 | tee export.log
          # Godot kończy eksport kodem 0 nawet po błędzie kompilacji C# – sprawdzamy wynik sami
          if grep -q "^ERROR" export.log; then echo "::error::Eksport zgłosił błędy"; exit 1; fi
          test -f build/windows/Otchlan.exe
          test -f build/windows/Otchlan.pck
          test -f build/windows/data_Otchlan_windows_x86_64/Otchlan.dll || { echo "::error::Brak skompilowanego C# (Otchlan.dll)"; ls -R build/windows | head -50; exit 1; }
          ls -la build/windows build/windows/data_Otchlan_windows_x86_64 | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: Otchlan-Windows
          path: build/windows
