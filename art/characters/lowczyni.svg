<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Łowczyni: łowczyni w zielonym kapturze z piórem i kołczanem. Patrzy w prawo (gra odbija w poziomie). -->
  <!-- kołczan na plecach -->
  <g transform="rotate(-24 62 90)" stroke="#1a0f1f" stroke-width="9" stroke-linejoin="round">
    <path d="M52 70 L 48 36 M 62 70 L 64 32 M 72 70 L 80 38" fill="none" stroke-width="7" stroke-linecap="round"/>
    <path d="M42 28 L 54 20 L 56 36 Z M 58 24 L 70 16 L 70 34 Z" fill="#ff4d5e" stroke-width="6"/>
    <rect x="40" y="64" width="44" height="64" rx="10" fill="#b97a4a"/>
    <rect x="40" y="86" width="44" height="10" fill="#8a5530" stroke="none"/>
  </g>
  <!-- stopy -->
  <g stroke="#1a0f1f" stroke-width="10" stroke-linejoin="round">
    <ellipse cx="100" cy="222" rx="24" ry="15" fill="#3a3550"/>
    <ellipse cx="158" cy="222" rx="24" ry="15" fill="#3a3550"/>
  </g>
  <!-- ciało -->
  <path d="M128 70 C 184 70 206 112 205 156 C 204 198 172 224 128 224 C 84 224 52 198 51 156 C 50 112 72 70 128 70 Z" fill="#5fcf6e"/>
  <!-- cień (cel shading) -->
  <path d="M205 150 C 204 196 172 222 128 222 C 100 222 78 212 64 196 C 98 208 152 204 180 178 C 194 166 202 156 205 150 Z" fill="#3fa44f"/>
  <!-- połysk -->
  <ellipse cx="86" cy="150" rx="11" ry="20" fill="#ffffff" opacity="0.45" transform="rotate(18 86 150)"/>
  <!-- obrys ciała -->
  <path d="M128 70 C 184 70 206 112 205 156 C 204 198 172 224 128 224 C 84 224 52 198 51 156 C 50 112 72 70 128 70 Z" fill="none" stroke="#1a0f1f" stroke-width="10" stroke-linejoin="round"/>
  <!-- kaptur -->
  <path d="M48 152 C 40 94 78 52 128 52 C 178 52 216 94 208 152 L 188 156 C 190 130 178 112 160 108 L 96 108 C 78 112 66 130 68 156 Z" fill="#35a957" stroke="#1a0f1f" stroke-width="10" stroke-linejoin="round"/>
  <path d="M192 100 C 202 118 206 136 205 152 L 190 154 C 190 134 184 118 172 108 Z" fill="#1f7a3b"/>
  <path d="M72 100 C 86 78 106 66 128 64" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- liść na kapturze -->
  <path d="M150 62 C 170 30 204 28 214 40 C 206 66 180 76 150 62 Z" fill="#9be86a" stroke="#1a0f1f" stroke-width="8" stroke-linejoin="round"/>
  <path d="M156 60 C 174 52 194 46 206 42" fill="none" stroke="#1a0f1f" stroke-width="5" stroke-linecap="round"/>
  <!-- pióro -->
  <path d="M168 56 C 176 30 200 14 222 18 C 220 38 204 54 180 62 Z" fill="#ff4d5e" stroke="#1a0f1f" stroke-width="8" stroke-linejoin="round"/>
  <path d="M176 54 C 188 40 202 30 216 22" fill="none" stroke="#ff97a0" stroke-width="5" stroke-linecap="round"/>
  <!-- pas kołczanu -->
  <path d="M60 176 L 126 224" stroke="#1a0f1f" stroke-width="22" stroke-linecap="butt"/>
  <path d="M60 176 L 126 224" stroke="#b97a4a" stroke-width="11" stroke-linecap="butt"/>
  <circle cx="92" cy="199" r="6" fill="#ffd23f" stroke="#1a0f1f" stroke-width="4"/>
  <!-- oczy -->
  <g>
    <ellipse cx="102" cy="138" rx="15" ry="18" fill="#fff" stroke="#1a0f1f" stroke-width="7"/>
    <circle cx="107" cy="141" r="8" fill="#1a0f1f"/>
    <circle cx="104" cy="137" r="3" fill="#fff"/>
    <ellipse cx="156" cy="140" rx="15" ry="10" fill="#fff" stroke="#1a0f1f" stroke-width="7"/>
    <circle cx="161" cy="142" r="7" fill="#1a0f1f"/>
    <circle cx="158" cy="139" r="2.5" fill="#fff"/>
  </g>
  <path d="M138 126 L 172 130" stroke="#1a0f1f" stroke-width="7" stroke-linecap="round"/>
  <path d="M86 122 C 96 116 108 116 118 120" fill="none" stroke="#1a0f1f" stroke-width="6" stroke-linecap="round"/>
  <!-- chytry uśmieszek -->
  <path d="M112 178 C 126 186 148 184 164 168" fill="none" stroke="#1a0f1f" stroke-width="7" stroke-linecap="round"/>
  <path d="M164 168 L 170 164" stroke="#1a0f1f" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="82" cy="170" rx="10" ry="6" fill="#ff7fa0" opacity="0.55"/>
  <ellipse cx="178" cy="166" rx="10" ry="6" fill="#ff7fa0" opacity="0.55"/>
</svg>
