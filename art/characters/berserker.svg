  <path d="M218 44 C 216 58 206 70 196 76" fill="none" stroke="#c9b98f" stroke-width="6" stroke-linecap="round"/>
  <!-- stopy -->
  <g stroke="#1a0f1f" stroke-width="10" stroke-linejoin="round">
    <ellipse cx="100" cy="222" rx="24" ry="15" fill="#3a3550"/>
    <ellipse cx="158" cy="222" rx="24" ry="15" fill="#3a3550"/>
  </g>
  <!-- ciało -->
  <path d="M128 70 C 184 70 206 112 205 156 C 204 198 172 224 128 224 C 84 224 52 198 51 156 C 50 112 72 70 128 70 Z" fill="#ff7a5c"/>
