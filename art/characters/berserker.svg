  <path d="M190 80 C 200 92 204 104 203 114 L 176 114 C 184 104 188 92 190 80 Z" fill="#66627d"/>
  <path d="M72 90 C 82 74 100 64 122 62" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <rect x="48" y="104" width="160" height="22" rx="8" fill="#b97a4a" stroke="#1a0f1f" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="74" cy="115" r="4" fill="#ffd23f"/><circle cx="128" cy="115" r="4" fill="#ffd23f"/><circle cx="182" cy="115" r="4" fill="#ffd23f"/>
