<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Berserker: wojownik w rogatym hełmie z rudą brodą i malowaniem wojennym. Patrzy w prawo (gra odbija w poziomie). -->
  <!-- rogi -->
  <path d="M70 96 C 38 96 22 64 32 30 C 50 46 68 56 88 66 Z" fill="#f1e6c8" stroke="#1a0f1f" stroke-width="9" stroke-linejoin="round"/>
