  <path d="M52 166 C 70 160 90 170 128 168 C 166 170 186 160 204 166 C 214 196 196 226 170 236 C 156 242 148 232 128 238 C 108 232 100 242 86 236 C 60 226 42 196 52 166 Z" fill="#ff9a3c" stroke="#1a0f1f" stroke-width="10" stroke-linejoin="round"/>
  <path d="M198 186 C 196 210 184 226 166 234 C 182 228 196 214 204 196 Z" fill="#d9701b"/>
  <path d="M66 184 C 66 196 72 208 82 216" fill="none" stroke="#ffd29a" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <path d="M110 214 C 114 224 120 228 124 232 M 146 212 C 144 222 138 228 134 232" fill="none" stroke="#d9701b" stroke-width="5" stroke-linecap="round"/>
