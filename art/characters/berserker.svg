  <path d="M128 176 C 112 164 84 166 74 184 C 92 186 114 186 128 176 Z M 128 176 C 144 164 172 166 182 184 C 164 186 142 186 128 176 Z" fill="#ff9a3c" stroke="#1a0f1f" stroke-width="7" stroke-linejoin="round"/>
