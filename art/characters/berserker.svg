  <path d="M60 150 L 100 168" stroke="#ff4d5e" stroke-width="5" stroke-linecap="round"/>
  <!-- oczy -->
  <g>
    <ellipse cx="102" cy="146" rx="14" ry="15" fill="#fff" stroke="#1a0f1f" stroke-width="7"/>
    <circle cx="107" cy="149" r="7" fill="#1a0f1f"/>
    <circle cx="104" cy="145" r="3" fill="#fff"/>
    <ellipse cx="156" cy="146" rx="14" ry="15" fill="#fff" stroke="#1a0f1f" stroke-width="7"/>
    <circle cx="161" cy="149" r="7" fill="#1a0f1f"/>
    <circle cx="158" cy="145" r="3" fill="#fff"/>
