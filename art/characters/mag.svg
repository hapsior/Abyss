<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Mag: czarodziej w wielkim spiczastym kapeluszu z gwiazdami i długą białą brodą. Patrzy w prawo (gra odbija w poziomie). -->
  
  <!-- stopy -->
  <g stroke="#1a0f1f" stroke-width="10" stroke-linejoin="round">
    <ellipse cx="100" cy="222" rx="24" ry="15" fill="#3a3550"/>
    <ellipse cx="158" cy="222" rx="24" ry="15" fill="#3a3550"/>
  </g>
  <!-- ciało -->
  <path d="M128 70 C 184 70 206 112 205 156 C 204 198 172 224 128 224 C 84 224 52 198 51 156 C 50 112 72 70 128 70 Z" fill="#a77bff"/>
  <!-- cień (cel shading) -->
  <path d="M205 150 C 204 196 172 222 128 222 C 100 222 78 212 64 196 C 98 208 152 204 180 178 C 194 166 202 156 205 150 Z" fill="#7d55d6"/>
  <!-- połysk -->
  <ellipse cx="86" cy="150" rx="11" ry="20" fill="#ffffff" opacity="0.45" transform="rotate(18 86 150)"/>
  <!-- obrys ciała -->
  <path d="M128 70 C 184 70 206 112 205 156 C 204 198 172 224 128 224 C 84 224 52 198 51 156 C 50 112 72 70 128 70 Z" fill="none" stroke="#1a0f1f" stroke-width="10" stroke-linejoin="round"/>
  <!-- broda -->
  <path d="M74 164 C 82 150 108 160 128 164 C 148 160 174 150 182 164 C 190 198 164 232 128 240 C 92 232 66 198 74 164 Z" fill="#fff" stroke="#1a0f1f" stroke-width="10" stroke-linejoin="round"/>
  <path d="M172 180 C 172 208 154 228 132 236 C 158 226 176 206 180 184 Z" fill="#c9c6e8"/>
  <path d="M90 180 C 90 196 98 210 108 218" fill="none" stroke="#e0def5" stroke-width="6" stroke-linecap="round"/>
  <path d="M124 214 C 128 222 128 228 128 232" fill="none" stroke="#c9c6e8" stroke-width="5" stroke-linecap="round"/>
  <!-- wąsy + uśmiech -->
  <path d="M128 176 C 112 164 90 168 84 184 C 100 188 118 186 128 176 Z M 128 176 C 144 164 166 168 172 184 C 156 188 138 186 128 176 Z" fill="#fff" stroke="#1a0f1f" stroke-width="7" stroke-linejoin="round"/>
  <!-- oczy -->
  <g>
    <ellipse cx="102" cy="142" rx="15" ry="18" fill="#fff" stroke="#1a0f1f" stroke-width="7"/>
    <circle cx="107" cy="145" r="8" fill="#1a0f1f"/>
    <circle cx="104" cy="141" r="3" fill="#fff"/>
    <ellipse cx="156" cy="142" rx="15" ry="18" fill="#fff" stroke="#1a0f1f" stroke-width="7"/>
    <circle cx="161" cy="145" r="8" fill="#1a0f1f"/>
    <circle cx="158" cy="141" r="3" fill="#fff"/>
  </g>
  <path d="M86 122 C 96 114 108 114 118 120 M 138 120 C 148 114 160 114 170 122" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <path d="M86 122 C 96 114 108 114 118 120 M 138 120 C 148 114 160 114 170 122" fill="none" stroke="#1a0f1f" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <!-- kapelusz: rondo -->
  <ellipse cx="128" cy="98" rx="94" ry="20" fill="#5b3fb0" stroke="#1a0f1f" stroke-width="10"/>
  <path d="M170 112 C 200 112 216 106 220 98 C 214 108 196 116 170 118 Z" fill="#432f8a"/>
  <!-- stożek -->
  <path d="M68 98 C 76 62 92 34 128 22 C 158 12 196 18 214 42 C 192 36 172 40 164 54 C 156 70 166 88 188 98 Z" fill="#5b3fb0" stroke="#1a0f1f" stroke-width="10" stroke-linejoin="round"/>
  <path d="M168 62 C 164 78 172 90 188 98 L 150 98 C 154 84 160 72 168 62 Z" fill="#432f8a"/>
  <path d="M82 86 C 88 66 100 48 118 38" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  <!-- opaska -->
  <path d="M72 84 C 100 94 150 96 186 88 L 188 100 C 150 108 100 106 70 98 Z" fill="#ffd23f" stroke="#1a0f1f" stroke-width="6" stroke-linejoin="round"/>
  <!-- gwiazdki i księżyc -->
  <path d="M112 62 L 116 70 L 125 71 L 118 77 L 120 86 L 112 81 L 104 86 L 106 77 L 99 71 L 108 70 Z" fill="#ffd23f" stroke="#1a0f1f" stroke-width="4" stroke-linejoin="round" transform="translate(8 -20) scale(.85)"/>
  <path d="M140 44 C 128 46 126 62 138 66 C 130 58 134 50 140 44 Z" fill="#ffd23f" stroke="#ffd23f" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="200" cy="44" r="5" fill="#ffd23f" stroke="#1a0f1f" stroke-width="3"/>
</svg>
