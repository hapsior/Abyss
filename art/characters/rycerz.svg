<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Rycerz: ciało-fasolka w kolorze postaci + hełm z pióropuszem. Patrzy w prawo (gra odbija w poziomie). -->
  <!-- stopy -->
  <g stroke="#1a0f1f" stroke-width="10" stroke-linejoin="round">
    <ellipse cx="100" cy="222" rx="24" ry="15" fill="#3a3550"/>
    <ellipse cx="158" cy="222" rx="24" ry="15" fill="#3a3550"/>
  </g>
  <!-- ciało -->
  <path d="M128 70 C 184 70 206 112 205 156 C 204 198 172 224 128 224 C 84 224 52 198 51 156 C 50 112 72 70 128 70 Z" fill="#5b9cff"/>
  <!-- cień (cel shading) -->
  <path d="M205 150 C 204 196 172 222 128 222 C 100 222 78 212 64 196 C 98 208 152 204 180 178 C 194 166 202 156 205 150 Z" fill="#3f75d1"/>
  <!-- połysk -->
  <ellipse cx="86" cy="150" rx="11" ry="20" fill="#ffffff" opacity="0.45" transform="rotate(18 86 150)"/>
  <!-- obrys ciała -->
  <path d="M128 70 C 184 70 206 112 205 156 C 204 198 172 224 128 224 C 84 224 52 198 51 156 C 50 112 72 70 128 70 Z" fill="none" stroke="#1a0f1f" stroke-width="10" stroke-linejoin="round"/>
  <!-- pióropusz -->
  <path d="M120 58 C 108 30 124 10 150 14 C 140 22 150 30 170 26 C 160 40 168 48 180 52 C 160 60 140 62 120 58 Z" fill="#ff4d5e" stroke="#1a0f1f" stroke-width="9" stroke-linejoin="round"/>
  <path d="M132 50 C 130 36 138 26 150 24" fill="none" stroke="#ff97a0" stroke-width="6" stroke-linecap="round"/>
  <!-- hełm: kopuła z otworem na twarz -->
  <path d="M50 150 C 46 96 80 56 128 56 C 176 56 210 96 206 150 L 186 152 C 186 128 176 114 160 110 L 96 110 C 80 114 70 128 70 152 Z" fill="#c8d2e6" stroke="#1a0f1f" stroke-width="10" stroke-linejoin="round"/>
  <path d="M74 98 C 88 78 108 68 128 68" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M190 104 C 200 120 204 134 203 148 L 188 150 C 188 132 182 118 172 110 Z" fill="#9aa6c2"/>
  <!-- nosal hełmu -->
  <path d="M120 106 L 136 106 L 134 140 L 122 140 Z" fill="#9aa6c2" stroke="#1a0f1f" stroke-width="8" stroke-linejoin="round"/>
  <!-- oczy -->
  <g stroke="#1a0f1f" stroke-width="7">
    <ellipse cx="102" cy="138" rx="15" ry="18" fill="#ffffff"/>
    <ellipse cx="156" cy="138" rx="15" ry="18" fill="#ffffff"/>
  </g>
  <circle cx="107" cy="141" r="8" fill="#1a0f1f"/>
  <circle cx="161" cy="141" r="8" fill="#1a0f1f"/>
  <circle cx="104" cy="137" r="3" fill="#ffffff"/>
  <circle cx="158" cy="137" r="3" fill="#ffffff"/>
  <!-- usta -->
  <path d="M116 178 C 124 188 140 188 148 176" fill="none" stroke="#1a0f1f" stroke-width="7" stroke-linecap="round"/>
  <!-- rumieńce -->
  <ellipse cx="86" cy="170" rx="10" ry="6" fill="#ff7fa0" opacity="0.55"/>
  <ellipse cx="172" cy="170" rx="10" ry="6" fill="#ff7fa0" opacity="0.55"/>
</svg>
